[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "okeylitctl"
version = "0.2.0"
description = "Restricted Linux control for validated HP OMEN four-zone RGB keyboards"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-only"
authors = [{name = "OKeyLitCtl contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.scripts]
okeylitctl = "okeylitctl.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]
