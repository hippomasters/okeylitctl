name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0 # Installer regression fixtures read the 0.2.0 tree via git show.
      - name: Trust this checkout for root-only fixture history reads
        run: sudo -n git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run privileged device-free integration tests
        run: sudo -n make test

  unprivileged-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run IPC, CLI and profile tests without elevation or hardware
        run: PYTHONPATH=src:tests python3 -m unittest -v test_ipc test_cli test_profiles
      - name: Build and install Python package
        run: |
          python3 -m pip install --disable-pip-version-check .
          okeylitctl --help
          okeylitctl --version
      - name: Build and execute installer-style zipapp
        run: |
          python3 -m zipapp src -m okeylitctl.cli:entrypoint -p /usr/bin/python3 -o /tmp/okeylitctl
          python3 /tmp/okeylitctl --help
          python3 /tmp/okeylitctl --version

  module-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install kernel headers
        run: sudo apt-get update && sudo apt-get install -y linux-headers-generic
      - name: Build external module with warnings
        run: |
          KDIR=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -n 1)
          test -n "$KDIR"
          make KDIR="$KDIR" W=1
      - name: Inspect module metadata
        run: |
          modinfo ./omen_rgb.ko
          test "$(modinfo -F license ./omen_rgb.ko)" = GPL
